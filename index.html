<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Screenshot Report</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f5f5f7;
      color: #1d1d1f;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
    }

    p {
      line-height: 1.6;
      color: #666;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 16px;
      margin-top: 12px;

      background: #007aff;
      color: white;

      font-size: 17px;
      font-weight: 600;

      cursor: pointer;
    }

    #projectArea {
      display: none;
      margin-top: 20px;
      padding-top: 20px;

      border-top: 1px solid #ddd;
    }

    .status {
      padding: 12px;
      border-radius: 10px;
      background: #f2f2f7;
      margin-top: 12px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <h1>Screenshot Report</h1>

      <p>
        將手機截圖重建成完整報告，
        並輸出 Markdown、PDF、Excel
        與 AI 分析。
      </p>

      <button onclick="createProject()">
        ＋ 建立新報告
      </button>

      <div id="projectArea">

        <h2>我的第一份報告</h2>

        <div class="status">
          ✅ 專案已建立
        </div>

        <button>
          ＋ 加入截圖
        </button>

      </div>

    </div>

  </div>

  <script>

    function createProject() {

      document.getElementById(
        "projectArea"
      ).style.display = "block";

    }

  </script>

</body>
</html>
