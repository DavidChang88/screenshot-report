<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Screenshot Report</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
    }

    h2 {
      font-size: 20px;
    }

    p {
      line-height: 1.6;
      color: #666;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 16px;
      margin-top: 12px;
      background: #007aff;
      color: white;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
    }

    #projectArea {
      display: none;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #ddd;
    }

    .status {
      padding: 12px;
      border-radius: 10px;
      background: #f2f2f7;
      margin-top: 12px;
    }

    #imageCount {
      margin-top: 16px;
      font-weight: 600;
    }

    #previewGrid {
      display: grid;
      grid-template-columns:
        repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 16px;
    }

    .preview-item {
      position: relative;
      overflow: hidden;
      border-radius: 8px;
      background: #eee;
      aspect-ratio: 9 / 16;
    }

    .preview-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .number {
      position: absolute;
      top: 5px;
      left: 5px;

      background: rgba(0,0,0,0.7);
      color: white;

      padding: 3px 7px;
      border-radius: 20px;
      font-size: 12px;
    }

    #fileInput {
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <h1>Screenshot Report</h1>

      <p>
        將手機截圖重建成完整報告，
        並輸出 Markdown、PDF、Excel
        與 AI 分析。
      </p>

      <button onclick="createProject()">
        ＋ 建立新報告
      </button>

      <div id="projectArea">

        <h2>我的第一份報告</h2>

        <div class="status">
          ✅ 專案已建立
        </div>

        <button onclick="selectImages()">
          ＋ 加入截圖
        </button>

        <input
          id="fileInput"
          type="file"
          accept="image/*"
          multiple
        >

        <div id="imageCount">
          尚未選擇圖片
        </div>

        <div id="previewGrid"></div>

      </div>

    </div>

  </div>


  <script>

    const fileInput =
      document.getElementById("fileInput");

    const imageCount =
      document.getElementById("imageCount");

    const previewGrid =
      document.getElementById("previewGrid");


    function createProject() {

      document.getElementById(
        "projectArea"
      ).style.display = "block";

    }


    function selectImages() {

      fileInput.click();

    }


    fileInput.addEventListener(
      "change",
      handleFiles
    );


    function handleFiles(event) {

      const files =
        Array.from(event.target.files);

      previewGrid.innerHTML = "";

      if (files.length === 0) {

        imageCount.textContent =
          "尚未選擇圖片";

        return;

      }


      imageCount.textContent =
        `已選擇 ${files.length} 張截圖`;


      files.forEach(
        (file, index) => {

          const item =
            document.createElement("div");

          item.className =
            "preview-item";


          const image =
            document.createElement("img");


          const number =
            document.createElement("div");

          number.className =
            "number";

          number.textContent =
            index + 1;


          const imageURL =
            URL.createObjectURL(file);


          image.src =
            imageURL;


          image.onload = function() {

            URL.revokeObjectURL(
              imageURL
            );

          };


          item.appendChild(image);
          item.appendChild(number);

          previewGrid.appendChild(item);

        }
      );

    }

  </script>

</body>
</html>
