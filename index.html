<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Screenshot Report</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f5f5f7;
      color: #1d1d1f;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
    }

    h2 {
      font-size: 20px;
    }

    p {
      line-height: 1.6;
      color: #666;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 16px;
      margin-top: 12px;

      background: #007aff;
      color: white;

      font-size: 17px;
      font-weight: 600;

      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .secondary-button {
      background: #e9e9ee;
      color: #1d1d1f;
    }

    .danger-button {
      background: #ff3b30;
    }

    #projectArea {
      display: none;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #ddd;
    }

    .status {
      padding: 12px;
      border-radius: 10px;
      background: #f2f2f7;
      margin-top: 12px;
    }

    #storageStatus {
      margin-top: 10px;
      padding: 10px;
      border-radius: 10px;
      background: #eef6ff;
      font-size: 14px;
    }

    #imageCount {
      margin-top: 16px;
      font-weight: 600;
    }

    #batchInfo {
      margin-top: 8px;
      color: #666;
      font-size: 14px;
    }

    #previewGrid {
      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 8px;
      margin-top: 16px;
    }

    .preview-item {
      position: relative;
      overflow: hidden;
      border-radius: 8px;
      background: #eee;
      aspect-ratio: 9 / 16;
    }

    .preview-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .number {
      position: absolute;

      top: 5px;
      left: 5px;

      background: rgba(0,0,0,0.75);
      color: white;

      padding: 4px 8px;
      border-radius: 20px;

      font-size: 12px;
      font-weight: 600;
    }

    #fileInput {
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <h1>Screenshot Report</h1>

      <p>
        將手機截圖重建成完整報告，
        並輸出 Markdown、PDF、Excel
        與 AI 分析。
      </p>

      <button
        id="createProjectButton"
        onclick="createProject()"
      >
        ＋ 建立新報告
      </button>

      <div id="projectArea">

        <h2>我的第一份報告</h2>

        <div class="status">
          ✅ 專案已建立
        </div>

        <div id="storageStatus">
          正在開啟本機資料庫…
        </div>

        <button
          id="addButton"
          onclick="selectImages()"
        >
          ＋ 加入一批截圖
        </button>

        <button
          class="danger-button"
          onclick="clearImages()"
        >
          清除全部截圖
        </button>

        <input
          id="fileInput"
          type="file"
          accept="image/*"
          multiple
        >

        <div id="imageCount">
          目前共 0 張截圖
        </div>

        <div id="batchInfo">
          尚未加入任何批次
        </div>

        <div id="previewGrid"></div>

      </div>

    </div>

  </div>


  <script>

    /*
      =========================
      IndexedDB 基本設定
      =========================
    */

    const DB_NAME =
      "ScreenshotReportDB";

    const DB_VERSION =
      1;

    const IMAGE_STORE =
      "images";


    let db = null;

    let projectImages = [];

    let batchCount = 0;


    /*
      =========================
      DOM
      =========================
    */

    const fileInput =
      document.getElementById(
        "fileInput"
      );

    const projectArea =
      document.getElementById(
        "projectArea"
      );

    const imageCount =
      document.getElementById(
        "imageCount"
      );

    const batchInfo =
      document.getElementById(
        "batchInfo"
      );

    const previewGrid =
      document.getElementById(
        "previewGrid"
      );

    const storageStatus =
      document.getElementById(
        "storageStatus"
      );

    const addButton =
      document.getElementById(
        "addButton"
      );


    /*
      =========================
      網頁啟動
      =========================
    */

    window.addEventListener(
      "DOMContentLoaded",
      startApp
    );


    async function startApp() {

      try {

        db =
          await openDatabase();

        storageStatus.textContent =
          "✅ 本機資料庫已啟用";

        await loadImagesFromDatabase();

      }
      catch (error) {

        console.error(error);

        storageStatus.textContent =
          "❌ 無法開啟本機資料庫";

        alert(
          "IndexedDB 啟動失敗：" +
          error.message
        );

      }

    }


    /*
      =========================
      建立 / 開啟 IndexedDB
      =========================
    */

    function openDatabase() {

      return new Promise(
        (resolve, reject) => {

          const request =
            indexedDB.open(
              DB_NAME,
              DB_VERSION
            );


          request.onupgradeneeded =
            function(event) {

              const database =
                event.target.result;


              if (
                !database.objectStoreNames
                  .contains(IMAGE_STORE)
              ) {

                const store =
                  database.createObjectStore(
                    IMAGE_STORE,
                    {
                      keyPath: "id",
                      autoIncrement: true
                    }
                  );


                store.createIndex(
                  "sequence",
                  "sequence",
                  {
                    unique: true
                  }
                );


                store.createIndex(
                  "batchNumber",
                  "batchNumber",
                  {
                    unique: false
                  }
                );

              }

            };


          request.onsuccess =
            function(event) {

              resolve(
                event.target.result
              );

            };


          request.onerror =
            function(event) {

              reject(
                event.target.error
              );

            };

        }
      );

    }


    /*
      =========================
      建立專案
      =========================
    */

    function createProject() {

      projectArea.style.display =
        "block";

    }


    /*
      =========================
      選擇圖片
      =========================
    */

    function selectImages() {

      if (!db) {

        alert(
          "本機資料庫尚未準備完成。"
        );

        return;

      }


      fileInput.value = "";

      fileInput.click();

    }


    fileInput.addEventListener(
      "change",
      handleFiles
    );


    /*
      =========================
      加入新批次
      =========================
    */

    async function handleFiles(event) {

      const files =
        Array.from(
          event.target.files
        );


      if (files.length === 0) {

        return;

      }


      addButton.disabled = true;

      storageStatus.textContent =
        `正在儲存 ${files.length} 張截圖…`;


      try {

        const newBatchNumber =
          batchCount + 1;

        let nextSequence =
          projectImages.length + 1;


        for (const file of files) {

          const record = {

            sequence:
              nextSequence,

            batchNumber:
              newBatchNumber,

            name:
              file.name,

            type:
              file.type,

            size:
              file.size,

            lastModified:
              file.lastModified,

            createdAt:
              Date.now(),

            blob:
              file

          };


          const id =
            await saveImageRecord(
              record
            );


          record.id = id;


          projectImages.push(
            record
          );


          nextSequence++;

        }


        batchCount =
          newBatchNumber;


        storageStatus.textContent =
          `✅ 已永久儲存這一批 ${files.length} 張截圖`;


        updateStatus(
          files.length
        );


        renderImages();

      }
      catch (error) {

        console.error(error);

        storageStatus.textContent =
          "❌ 儲存圖片失敗";

        alert(
          "圖片儲存失敗：" +
          error.message
        );

      }
      finally {

        addButton.disabled =
          false;

      }

    }


    /*
      =========================
      儲存單一圖片
      =========================
    */

    function saveImageRecord(record) {

      return new Promise(
        (resolve, reject) => {

          const transaction =
            db.transaction(
              IMAGE_STORE,
              "readwrite"
            );


          const store =
            transaction.objectStore(
              IMAGE_STORE
            );


          const request =
            store.add(record);


          request.onsuccess =
            function() {

              resolve(
                request.result
              );

            };


          request.onerror =
            function() {

              reject(
                request.error
              );

            };

        }
      );

    }


    /*
      =========================
      重新載入資料庫圖片
      =========================
    */

    function getAllImageRecords() {

      return new Promise(
        (resolve, reject) => {

          const transaction =
            db.transaction(
              IMAGE_STORE,
              "readonly"
            );


          const store =
            transaction.objectStore(
              IMAGE_STORE
            );


          const request =
            store.getAll();


          request.onsuccess =
            function() {

              resolve(
                request.result
              );

            };


          request.onerror =
            function() {

              reject(
                request.error
              );

            };

        }
      );

    }


    async function loadImagesFromDatabase() {

      const records =
        await getAllImageRecords();


      records.sort(
        (a, b) =>
          a.sequence -
          b.sequence
      );


      projectImages =
        records;


      if (
        projectImages.length === 0
      ) {

        batchCount = 0;

        updateStatus(0);

        return;

      }


      batchCount =
        Math.max(
          ...projectImages.map(
            item =>
              item.batchNumber || 1
          )
        );


      /*
        有舊資料時，
        自動顯示專案。
      */
      projectArea.style.display =
        "block";


      storageStatus.textContent =
        `✅ 已從手機載入 ${projectImages.length} 張截圖`;


      updateStatus(0);

      renderImages();

    }


    /*
      =========================
      更新狀態
      =========================
    */

    function updateStatus(lastBatchSize) {

      imageCount.textContent =
        `目前共 ${projectImages.length} 張截圖`;


      if (
        projectImages.length === 0
      ) {

        batchInfo.textContent =
          "尚未加入任何批次";

        return;

      }


      if (lastBatchSize > 0) {

        batchInfo.textContent =
          `已加入 ${batchCount} 批，` +
          `上一批加入 ${lastBatchSize} 張`;

      }
      else {

        batchInfo.textContent =
          `目前共有 ${batchCount} 個批次`;

      }

    }


    /*
      =========================
      顯示縮圖
      =========================
    */

    function renderImages() {

      previewGrid.innerHTML = "";


      projectImages.forEach(
        (imageData, index) => {

          const item =
            document.createElement(
              "div"
            );

          item.className =
            "preview-item";


          const image =
            document.createElement(
              "img"
            );


          const number =
            document.createElement(
              "div"
            );


          number.className =
            "number";

          number.textContent =
            index + 1;


          const imageURL =
            URL.createObjectURL(
              imageData.blob
            );


          image.src =
            imageURL;


          image.onload =
            function() {

              URL.revokeObjectURL(
                imageURL
              );

            };


          item.appendChild(image);

          item.appendChild(number);

          previewGrid.appendChild(
            item
          );

        }
      );

    }


    /*
      =========================
      清除全部 IndexedDB 圖片
      =========================
    */

    function clearDatabaseImages() {

      return new Promise(
        (resolve, reject) => {

          const transaction =
            db.transaction(
              IMAGE_STORE,
              "readwrite"
            );


          const store =
            transaction.objectStore(
              IMAGE_STORE
            );


          const request =
            store.clear();


          request.onsuccess =
            function() {

              resolve();

            };


          request.onerror =
            function() {

              reject(
                request.error
              );

            };

        }
      );

    }


    async function clearImages() {

      if (!db) {

        return;

      }


      const confirmed =
        confirm(
          "確定要永久刪除目前所有截圖嗎？"
        );


      if (!confirmed) {

        return;

      }


      try {

        await clearDatabaseImages();


        projectImages = [];

        batchCount = 0;


        previewGrid.innerHTML = "";


        updateStatus(0);


        storageStatus.textContent =
          "✅ 所有本機截圖已刪除";

      }
      catch (error) {

        console.error(error);

        alert(
          "刪除失敗：" +
          error.message
        );

      }

    }

  </script>

</body>
</html>
