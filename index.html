<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Screenshot Report</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f5f5f7;
      color: #1d1d1f;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
    }

    h2 {
      font-size: 20px;
    }

    p {
      line-height: 1.6;
      color: #666;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 16px;
      margin-top: 12px;

      background: #007aff;
      color: white;

      font-size: 17px;
      font-weight: 600;

      cursor: pointer;
    }

    .secondary-button {
      background: #e9e9ee;
      color: #1d1d1f;
    }

    #projectArea {
      display: none;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #ddd;
    }

    .status {
      padding: 12px;
      border-radius: 10px;
      background: #f2f2f7;
      margin-top: 12px;
    }

    #imageCount {
      margin-top: 16px;
      font-weight: 600;
    }

    #batchInfo {
      margin-top: 8px;
      color: #666;
      font-size: 14px;
    }

    #previewGrid {
      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 8px;
      margin-top: 16px;
    }

    .preview-item {
      position: relative;

      overflow: hidden;

      border-radius: 8px;

      background: #eee;

      aspect-ratio: 9 / 16;
    }

    .preview-item img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;
    }

    .number {
      position: absolute;

      top: 5px;
      left: 5px;

      background: rgba(0,0,0,0.75);
      color: white;

      padding: 4px 8px;

      border-radius: 20px;

      font-size: 12px;

      font-weight: 600;
    }

    #fileInput {
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <h1>Screenshot Report</h1>

      <p>
        將手機截圖重建成完整報告，
        並輸出 Markdown、PDF、Excel
        與 AI 分析。
      </p>

      <button onclick="createProject()">
        ＋ 建立新報告
      </button>

      <div id="projectArea">

        <h2>我的第一份報告</h2>

        <div class="status">
          ✅ 專案已建立
        </div>

        <button onclick="selectImages()">
          ＋ 加入一批截圖
        </button>

        <button
          class="secondary-button"
          onclick="clearImages()"
        >
          清除全部截圖
        </button>

        <input
          id="fileInput"
          type="file"
          accept="image/*"
          multiple
        >

        <div id="imageCount">
          目前共 0 張截圖
        </div>

        <div id="batchInfo">
          尚未加入任何批次
        </div>

        <div id="previewGrid"></div>

      </div>

    </div>

  </div>


  <script>

    const fileInput =
      document.getElementById("fileInput");

    const imageCount =
      document.getElementById("imageCount");

    const batchInfo =
      document.getElementById("batchInfo");

    const previewGrid =
      document.getElementById("previewGrid");


    /*
      目前所有已加入的截圖
      Phase 1-B 只存在記憶體。

      下一階段才會改成 IndexedDB。
    */
    let projectImages = [];


    /*
      記錄加入了幾個批次。
    */
    let batchCount = 0;


    function createProject() {

      document.getElementById(
        "projectArea"
      ).style.display = "block";

    }


    function selectImages() {

      /*
        清空 input 的舊 value，
        讓使用者再次選同一批檔案時，
        change 事件仍可正常觸發。
      */
      fileInput.value = "";

      fileInput.click();

    }


    fileInput.addEventListener(
      "change",
      handleFiles
    );


    function handleFiles(event) {

      const files =
        Array.from(event.target.files);


      if (files.length === 0) {

        return;

      }


      batchCount++;


      /*
        把這一批加入既有陣列尾端，
        不清除上一批。
      */
      files.forEach((file) => {

        projectImages.push({
          id: createImageId(),
          file: file
        });

      });


      updateStatus(
        files.length
      );


      renderImages();

    }


    function createImageId() {

      return (
        Date.now().toString() +
        "-" +
        Math.random()
          .toString(36)
          .slice(2)
      );

    }


    function updateStatus(lastBatchSize) {

      imageCount.textContent =
        `目前共 ${projectImages.length} 張截圖`;


      batchInfo.textContent =
        `已加入 ${batchCount} 批，` +
        `上一批加入 ${lastBatchSize} 張`;

    }


    function renderImages() {

      /*
        先清除舊縮圖，
        再按照 projectImages
        的目前順序重新畫一次。
      */
      previewGrid.innerHTML = "";


      projectImages.forEach(
        (imageData, index) => {

          const item =
            document.createElement("div");

          item.className =
            "preview-item";


          const image =
            document.createElement("img");


          const number =
            document.createElement("div");

          number.className =
            "number";

          number.textContent =
            index + 1;


          const imageURL =
            URL.createObjectURL(
              imageData.file
            );


          image.src =
            imageURL;


          image.onload = function() {

            URL.revokeObjectURL(
              imageURL
            );

          };


          item.appendChild(image);

          item.appendChild(number);

          previewGrid.appendChild(item);

        }
      );

    }


    function clearImages() {

      const confirmed =
        confirm(
          "確定要清除目前所有截圖嗎？"
        );


      if (!confirmed) {

        return;

      }


      projectImages = [];

      batchCount = 0;

      previewGrid.innerHTML = "";

      imageCount.textContent =
        "目前共 0 張截圖";

      batchInfo.textContent =
        "尚未加入任何批次";

    }

  </script>

</body>
</html>
